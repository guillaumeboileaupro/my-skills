<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VU-metre analogique - ressort et amortissement</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eee;background:#151719;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:24px;display:grid;place-items:center;min-height:100vh}
main{width:min(100%,680px)}h1{font-size:1.4rem} .meter{background:#292c30;border:4px solid #555b60;border-radius:16px;padding:12px}
svg{display:block;width:100%;height:auto}.controls{display:grid;gap:14px;margin-top:18px}
label{display:flex;justify-content:space-between;gap:10px}input[type=range]{width:100%;accent-color:#db7950}
.buttons{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #777;background:#30343a;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #f6b86c;outline-offset:3px}
.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats span{background:#282c30;border-radius:6px;padding:8px 12px}
small{color:#bcbcbc} @media(prefers-reduced-motion:reduce){.meter svg{transition:none}}
</style>
</head>
<body>
<main>
<h1>VU-metre analogique a ressort</h1>
<div class="meter">
<svg viewBox="0 0 360 230" role="img" aria-label="Cadran VU analogique avec aiguille mobile">
<defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f6e8c4"/><stop offset="1" stop-color="#d9c498"/></linearGradient></defs>
<rect x="4" y="4" width="352" height="222" rx="12" fill="#181b1e" stroke="#505359" stroke-width="4"/>
<rect x="16" y="16" width="328" height="198" rx="7" fill="url(#paper)"/>
<g id="ticks"></g>
<path d="M56 161 A124 124 0 0 1 304 161" fill="none" stroke="#564c3b"/>
<g id="needle" transform="rotate(-65 180 165)"><path d="M180 180 L179 37 L181 37 L181 180Z" fill="#a83229"/></g>
<circle cx="180" cy="165" r="10" fill="#55524d" stroke="#b4a78c" stroke-width="3"/>
<text x="180" y="199" text-anchor="middle" font-size="23" font-weight="bold" fill="#443d32">VU</text>
<text x="180" y="211" text-anchor="middle" font-size="8" fill="#64594a">SPRING MOVEMENT</text>
</svg>
</div>
<div class="stats" aria-live="off">
<span>Signal : <output id="signal">0.0 VU</output></span>
<span>Aiguille : <output id="reading">-20.0 VU</output></span>
<span>Vitesse : <output id="speed">0 deg/s</output></span>
</div>
<div class="controls">
<div><label for="level">Niveau du signal <output id="targetLabel">0.0 VU</output></label><input id="level" type="range" min="0" max="100" value="80"></div>
<div><label for="spring">Raideur du ressort <output id="springLabel">45</output></label><input id="spring" type="range" min="5" max="100" value="45"></div>
<div><label for="damping">Amortissement <output id="dampingLabel">22</output></label><input id="damping" type="range" min="0" max="100" value="22"></div>
<div class="buttons"><button id="step">Impulsion 0 VU</button><button id="release">Relacher</button><button id="demo" aria-pressed="false">Musique simulee</button></div>
<small>Demonstration visuelle : la physique est parametrique et non etalonnee a la norme VU de 300 ms. Les graduations sont une approximation graphique, pas un instrument de mesure certifie.</small>
</div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const ns="http://www.w3.org/2000/svg";
const rad=a=>a*Math.PI/180;
const xy=(a,r)=>[180+r*Math.sin(rad(a)),165-r*Math.cos(rad(a))];
for(let i=0;i<=30;i++){
 const a=-65+i*130/30,major=i%5===0,p=xy(a,major?111:118),q=xy(a,129);
 const line=document.createElementNS(ns,"line");
 for(const [key,value] of Object.entries({x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:i>=24?"#b33e30":"#413b32","stroke-width":major?2:1}))line.setAttribute(key,String(value));
 $("ticks").append(line);
}
for(const [value,a] of [["-20",-65],["-10",-39],["-5",-13],["0",39],["+3",65]]){
 const p=xy(a,97),node=document.createElementNS(ns,"text");
 for(const [key,v] of Object.entries({x:p[0],y:p[1]+4,"text-anchor":"middle","font-size":12,"font-weight":"bold",fill:a>40?"#ad3027":"#3e382f"}))node.setAttribute(key,String(v));
 node.textContent=value;$("ticks").append(node);
}
let pos=-65,velocity=0,target=39,phase=0,demo=false,last=0,accumulator=0;
const angleFromLevel=v=>-65+v*1.3;
const vuFromAngle=a=>{const x=(a+65)/130;return x<=0.8?-20+25*x:(x-0.8)*15;};
function updateTarget(){
 target=angleFromLevel(Number($("level").value));
 const label=vuFromAngle(target).toFixed(1)+" VU";
 $("targetLabel").textContent=label;$("signal").textContent=label;
}
$("level").addEventListener("input",()=>{demo=false;syncDemo();updateTarget();});
for(const id of ["spring","damping"])$(id).addEventListener("input",()=>$(id+"Label").textContent=$(id).value);
$("step").addEventListener("click",()=>{demo=false;syncDemo();$("level").value=80;updateTarget();pos=-65;velocity=0;});
$("release").addEventListener("click",()=>{demo=false;syncDemo();$("level").value=0;updateTarget();});
$("demo").addEventListener("click",()=>{demo=!demo;syncDemo();});
function syncDemo(){$("demo").textContent=demo?"Arreter la simulation":"Musique simulee";$("demo").setAttribute("aria-pressed",String(demo));}
updateTarget();
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
function frame(time){
 if(!last)last=time;
 const elapsed=Math.min((time-last)/1000,0.05);last=time;
 if(document.hidden){requestAnimationFrame(frame);return;}
 if(demo){
 phase+=elapsed;
 const value=35+35*Math.abs(Math.sin(phase*2.2))+25*Math.pow(Math.sin(phase*5.7),4);
 $("level").value=String(Math.min(100,value));updateTarget();
 }
 const stiffness=8+Number($("spring").value)*0.55;
 const damping=0.5+Number($("damping").value)*0.16;
 if(reduceMotion.matches){pos=target;velocity=0;accumulator=0;}
 else{
 accumulator=Math.min(accumulator+elapsed,0.05);
 const h=1/120;
 while(accumulator>=h){
 const acceleration=stiffness*(target-pos)-damping*velocity;
 velocity+=acceleration*h;pos+=velocity*h;
 if(pos>80){pos=80;velocity=-Math.abs(velocity)*0.18;}
 if(pos< -70){pos=-70;velocity=Math.abs(velocity)*0.18;}
 accumulator-=h;
 }
 }
 $("needle").setAttribute("transform",`rotate(${pos} 180 165)`);
 $("reading").textContent=vuFromAngle(pos).toFixed(1)+" VU";
 $("speed").textContent=Math.round(velocity)+" deg/s";
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
